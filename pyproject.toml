[project]
name = "search_engine_for_document_texts"
version = "0.1.0"
description = ""
authors = [
    { name = "Rom1987", email = "maks3564195@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "elasticsearch (>=9.5.1,<10.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]

[project.optional-dependencies]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-v --tb=short"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
